  <style>
        :root {
            --bg-primary: #0d112c;

 / * #0a0a0a; */
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --border-color: #373857; /* 333 */
            --text-primary: #ffffff;
            --text-secondary: #aaaabc;
            --accent-color: #007aff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Roboto Mono, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .left-panel {
            width: 320px;
            background: var(--bg-secondary);
            padding: 20px;
            margin: 20px 20px;
            /** border-right: 1px solid var(--border-color); **/
            display: flex;
            flex-direction: column;
            position:absolute;
            z-index: 1;
        }
        .right-panel {
            flex: 1;
            position: relative;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        h3 {
            font-size: 14px;
            font-weight: 500;
            margin: 24px 0 12px 0;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 24px 0 12px 0;
        }
        .section-header h3 {
            margin: 0;
        }
        .icon-buttons {
            display: flex;
            gap: 4px;
        }
        hgroup h3 {
        display: inline;
        }
        .icon-button {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        .icon-button:hover {
            background: #2a2a2a;
        }
        .info-popup {
            position: relative;
            display: inline-block;
        }
        .info-tooltip {
          font-family: Roboto Mono, Arial, sans-serif;
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 12px;
            min-width: 200px;
            font-size: 12px;
            z-index: 1000;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .info-popup:hover .info-tooltip {
            visibility: visible;
            opacity: 1;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .block-palette {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
        }
        .block-template {
            background: var(--text-primary);
            cursor: grab;
            transition: transform 0.1s ease-out;
        }
        .block-template:active {
            cursor: grabbing;
            transform: scale(0.9);
        }
        .puzzle-wrapper {
            position: relative;
            width: 244px; /* 240px grid + 2px border on each side */
            height: 304px; /* 300px grid + 2px border top/bottom */
            margin: 20px 0;
            border: 2px solid var(--border-color);
            padding: 0;
        }
        .puzzle-wrapper::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 60px;
            width: 120px;
            height: 4px;
            background: var(--bg-primary);
        }
        .puzzle-container {
            position: relative;
            width: 240px;
            height: 300px;
            background-image:
                linear-gradient(to right, var(--border-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--border-color) 1px, transparent 1px);
            background-size: 60px 60px;
            background-color: var(--bg-tertiary);
        }
        .block {
            position: absolute;
            cursor: grab;
            transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 2px solid rgba(0,0,0,0.2);
        }
        .block.dragging {
            opacity: 0.5;
            z-index: 1000;
            pointer-events: none;
        }
        .ghost-block {
            position: absolute;
            background: var(--accent-color);
            opacity: 0.4;
            pointer-events: none;
            z-index: 999;
            transition: all 0.05s linear;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        button {
            padding: 10px 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            transition: background-color 0.2s;
        }
        button:hover { background: #2a2a2a; }
        button:disabled { background: #222; color: #666; cursor: not-allowed; }
        .status {
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
        }
        #visualization { width: 100%; height: 100%; background: var(--bg-primary); }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #666;
        }

<body>

<!-- Klotski Logic (Plain JS) -->
<script type="module">
    import * as THREE from 'three';

        let puzzleState = Array(20).fill(null);
        let blockCounter = 0;
        let isGenerating = false;
        let ghostBlock = null;
        let draggedElement = null;
        let dropSuccess = false;
        let currentSearchNode = null;
        let nodeStates = new Map(); // Store states for each node

        const GRID_WIDTH = 4;
        const GRID_HEIGHT = 5;
        const CELL_SIZE = 60;

        const blockTypes = {
            '2x2': { width: 2, height: 2 }, '2x1': { width: 2, height: 1 },
            '1x2': { width: 1, height: 2 }, '1x1': { width: 1, height: 1 }
        };

        const blockColors = [
            "#e63946", "#f1faee", "#a8dadc", "#457b9d", "#1d3557",
            "#ffb703", "#fb8500", "#e76f51", "#2a9d8f", "#264653",
            "#f72585", "#b5179e", "#7209b7", "#480ca8", "#3a0ca3"
        ];
        let colorIndex = 0;

        function getRandomColor() {
            return blockColors[Math.floor(Math.random() * blockColors.length)];
        }




        function generateRandomPuzzle() {
            clearPuzzle();

            // Always include one 2x2 block (required for win condition)
            const mainBlockRow = Math.floor(Math.random() * 4);
            const mainBlockCol = Math.floor(Math.random() * 3);
            createBlock('2x2', mainBlockRow, mainBlockCol);

            // Generate random additional blocks, leaving 2-5 squares free
            const totalCells = 20;
            const usedCells = 4; // 2x2 block
            const freeCells = 2 + Math.floor(Math.random() * 4); // 2-5 free cells
            const remainingCells = totalCells - usedCells - freeCells;

            let placedCells = usedCells;
            const blockTypeList = ['2x1', '1x2', '1x1'];

            let attempts = 0;
            while (placedCells < totalCells - freeCells && attempts < 50) {
                const randomType = blockTypeList[Math.floor(Math.random() * blockTypeList.length)];
                const blockData = blockTypes[randomType];

                const row = Math.floor(Math.random() * (GRID_HEIGHT - blockData.height + 1));
                const col = Math.floor(Math.random() * (GRID_WIDTH - blockData.width + 1));

                if (canPlaceBlock(null, randomType, row, col)) {
                    createBlock(randomType, row, col);
                    placedCells += blockData.width * blockData.height;
                } else {
                    attempts++;
                }
            }

            updateStatus(`Jogo aleatório formado com ${document.querySelectorAll('.block').length} blocos.`);
          generateGraph();
        }

                function init() {
            setupDragAndDrop();
            //generateRandomPuzzle();
        }

        function createGhostBlock() {
            if (!ghostBlock) {
                ghostBlock = document.createElement('div');
                ghostBlock.className = 'ghost-block';
                document.getElementById('puzzleContainer').appendChild(ghostBlock);
            }
        }

        function setupDragAndDrop() {
            const templates = document.querySelectorAll('.block-template');
            const puzzleContainer = document.getElementById('puzzleContainer');

            templates.forEach(template => {
                template.draggable = true;
                template.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', e.target.dataset.type);
                    e.dataTransfer.effectAllowed = 'copy';
                    draggedElement = e.target;
                });
            });

            puzzleContainer.addEventListener('dragstart', e => {
                if(e.target.classList.contains('block')) {
                    draggedElement = e.target;
                    setTimeout(() => e.target.classList.add('dragging'), 0);
                    e.dataTransfer.setData('block-id', e.target.dataset.blockId);
                    e.dataTransfer.effectAllowed = 'move';
                }
            });

            puzzleContainer.addEventListener('dragenter', e => {
                e.preventDefault();
                if (!draggedElement) return;
                createGhostBlock();
                ghostBlock.style.display = 'block';
            });

            puzzleContainer.addEventListener('dragover', e => {
                e.preventDefault();
                if (!ghostBlock || !draggedElement) return;

                const type = draggedElement.dataset.type || e.dataTransfer.getData('text/plain');
                if (!blockTypes[type]) return;

                const blockData = blockTypes[type];
                const rect = puzzleContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                let col = Math.floor(x / CELL_SIZE);
                let row = Math.floor(y / CELL_SIZE);

                col = Math.max(0, Math.min(col, GRID_WIDTH - blockData.width));
                row = Math.max(0, Math.min(row, GRID_HEIGHT - blockData.height));

                ghostBlock.style.width = `${blockData.width * CELL_SIZE}px`;
                ghostBlock.style.height = `${blockData.height * CELL_SIZE}px`;
                ghostBlock.style.left = `${col * CELL_SIZE}px`;
                ghostBlock.style.top = `${row * CELL_SIZE}px`;
            });

            puzzleContainer.addEventListener('dragleave', e => {
                if (ghostBlock && e.target === puzzleContainer) {
                    ghostBlock.style.display = 'none';
                }
            });

            puzzleContainer.addEventListener('drop', e => {
                e.preventDefault();
                if (ghostBlock) ghostBlock.style.display = 'none';
                if (!draggedElement) return;

                const rect = puzzleContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const col = Math.floor(x / CELL_SIZE);
                const row = Math.floor(y / CELL_SIZE);

                const newBlockType = e.dataTransfer.getData('text/plain');
                const existingBlockId = e.dataTransfer.getData('block-id');

                if (existingBlockId) {
                    moveBlock(existingBlockId, row, col);
                } else if (blockTypes[newBlockType]) {
                    createBlock(newBlockType, row, col);
                }
                dropSuccess = true;
            });

            document.addEventListener('dragend', e => {
                if (draggedElement && draggedElement.classList.contains('block')) {
                    if (!dropSuccess) {
                        removeBlock(draggedElement.dataset.blockId);
                    }
                    draggedElement.classList.remove('dragging');
                }
                draggedElement = null;
                dropSuccess = false;
                generateGraph();
            });
        }

        function createBlock(type, row, col) {
            const blockData = blockTypes[type];
            row = Math.min(row, GRID_HEIGHT - blockData.height);
            col = Math.min(col, GRID_WIDTH - blockData.width);

            if (!canPlaceBlock(null, type, row, col)) {
                updateStatus('Não pode adicionar um bloco aqui.');
                return;
            }

            const blockId = blockCounter++;
            const block = document.createElement('div');
            block.className = 'block';
            block.draggable = true;
            block.dataset.blockId = blockId;
            block.dataset.type = type;

            block.style.width = `${blockData.width * CELL_SIZE}px`;
            block.style.height = `${blockData.height * CELL_SIZE}px`;
            block.style.left = `${col * CELL_SIZE}px`;
            block.style.top = `${row * CELL_SIZE}px`;
            block.style.backgroundColor = getRandomColor();

            document.getElementById('puzzleContainer').appendChild(block);
            markBlockInState(row, col, blockData.width, blockData.height, blockId);
        }

        function moveBlock(blockId, newRow, newCol) {
            const block = document.querySelector(`[data-block-id="${blockId}"]`);
            if (!block) return;

            const type = block.dataset.type;
            const blockData = blockTypes[type];

            newRow = Math.min(newRow, GRID_HEIGHT - blockData.height);
            newCol = Math.min(newCol, GRID_WIDTH - blockData.width);

            const oldState = getCurrentPuzzleState();
            const oldBlock = oldState.find(b => b.id == blockId);
            clearBlockArea(oldBlock.row, oldBlock.col, oldBlock.width, oldBlock.height);

            if (canPlaceBlock(blockId, type, newRow, newCol)) {
                block.style.left = `${newCol * CELL_SIZE}px`;
                block.style.top = `${newRow * CELL_SIZE}px`;
                markBlockInState(newRow, newCol, blockData.width, blockData.height, blockId);
            } else {
                markBlockInState(oldBlock.row, oldBlock.col, oldBlock.width, oldBlock.height, blockId);
            }
        }

        function removeBlock(blockId) {
            const block = document.querySelector(`[data-block-id="${blockId}"]`);
            if (!block) return;

            const state = getCurrentPuzzleState();
            const blockToRemove = state.find(b => b.id == blockId);
            if (blockToRemove) {
                clearBlockArea(blockToRemove.row, blockToRemove.col, blockToRemove.width, blockToRemove.height);
            }
            block.remove();
        }

        function canPlaceBlock(excludeId, type, row, col) {
            const { width, height } = blockTypes[type];
            if (row < 0 || col < 0 || row + height > GRID_HEIGHT || col + width > GRID_WIDTH) return false;
            for (let r = row; r < row + height; r++) {
                for (let c = col; c < col + width; c++) {
                    const occupant = puzzleState[r * GRID_WIDTH + c];
                    if (occupant !== null && occupant != excludeId) return false;
                }
            }
            return true;
        }

        function clearBlockArea(row, col, width, height) {
             for (let r = row; r < row + height; r++) {
                for (let c = col; c < col + width; c++) {
                    puzzleState[r * GRID_WIDTH + c] = null;
                }
            }
        }

        function markBlockInState(row, col, width, height, blockId) {
            for (let r = row; r < row + height; r++) {
                for (let c = col; c < col + width; c++) {
                    puzzleState[r * GRID_WIDTH + c] = blockId;
                }
            }
        }

        function clearPuzzle() {
            if (isGenerating) return;
            puzzleState.fill(null);
            document.querySelectorAll('.block').forEach(b => b.remove());
            blockCounter = 0;
            colorIndex = 0;
            updateStatus('Jogo resetado.');
            window.updateGraphData({ nodes: [], links: [] });
        }

        function displayPuzzleState(state) {
            // Clear current display
            document.querySelectorAll('.block').forEach(b => b.remove());
            puzzleState.fill(null);

            // Display the given state
            state.forEach(block => {
                const blockElement = document.createElement('div');
                blockElement.className = 'block';
                blockElement.dataset.blockId = block.id;
                blockElement.dataset.type = block.type;

                blockElement.style.width = `${block.width * CELL_SIZE}px`;
                blockElement.style.height = `${block.height * CELL_SIZE}px`;
                blockElement.style.left = `${block.col * CELL_SIZE}px`;
                blockElement.style.top = `${block.row * CELL_SIZE}px`;
                blockElement.style.backgroundColor = getRandomColor();

                document.getElementById('puzzleContainer').appendChild(blockElement);
                markBlockInState(block.row, block.col, block.width, block.height, block.id);
            });
        }

        function updateStatus(message) {
            document.getElementById('status').innerHTML = message;
        }

        function generateGraph() {
            if (document.querySelectorAll('.block').length === 0) {
                updateStatus('Adicione blocos na malha primeiro.');
                return;
            }
            if (!Array.from(document.querySelectorAll('.block')).some(b => b.dataset.type === '2x2')) {
                updateStatus('O jogo deve incluir um bloco 2x2.');
                return;
            }

            isGenerating = true;
            updateStatus('Gerando...');
            currentSearchNode = null;
            nodeStates.clear();

            buildStateGraphAnimated();
        }

        function buildStateGraphAnimated(strategy = 'bfs', closenessHighlight = false) {
            const initialState = getCurrentPuzzleState(); 
            const stateToNodeId = new Map(); 
            let graphData = { nodes: [], links: [] };

            if (strategy === 'bfs') {
                bfs(graphData, initialState, stateToNodeId);
            } else if (strategy === 'dfs') {
                dfs(graphData, initialState, stateToNodeId);
            }

            calculateCentrality(graphData, closenessHighlight);
            finishGeneration(graphData);
        }

        function bfs(graphData, initialState, stateToNodeId) {
            const visited = new Set();
            const queue = [{ state: initialState, parent: null }];

            while (queue.length > 0) {
                const { state, parent } = queue.shift();
                const stateKey = stateToString(state);
                if (visited.has(stateKey)) continue;
                visited.add(stateKey);

                const nodeId = graphData.nodes.length;
                stateToNodeId.set(stateKey, nodeId);
                const isSolution = isWinState(state);

                const newNode = {
                    id: nodeId,
                    isSolution: isSolution,
                    label: `Estado ${nodeId}`
                };
                graphData.nodes.push(newNode);
                nodeStates.set(nodeId, state);

                currentSearchNode = nodeId;
                if (parent !== null) graphData.links.push({ source: parent, target: nodeId });

                window.updateGraphData({ ...graphData });
                document.getElementById('stateCount').textContent = graphData.nodes.length;
                document.getElementById('edgeCount').textContent = graphData.links.length;

                const nextStates = generateNextStates(state);
                for (const next of nextStates) {
                    const nextStateKey = stateToString(next);
                    if (!visited.has(nextStateKey)) queue.push({ state: next, parent: nodeId });
                    else graphData.links.push({ source: nodeId, target: stateToNodeId.get(nextStateKey) });
                }
            }
        }

        function dfs(graphData, initialState, stateToNodeId) {
            const visited = new Set();
            const stack = [{ state: initialState, parent: null }];

            while (stack.length > 0) {
                const { state, parent } = stack.pop();
                const stateKey = stateToString(state);
                if (visited.has(stateKey)) continue;
                visited.add(stateKey);

                const nodeId = graphData.nodes.length;
                stateToNodeId.set(stateKey, nodeId);
                const isSolution = isWinState(state);

                const newNode = { id: nodeId, isSolution, label: `Estado ${nodeId}` };
                graphData.nodes.push(newNode);
                nodeStates.set(nodeId, state);

                currentSearchNode = nodeId;
                if (parent !== null) graphData.links.push({ source: parent, target: nodeId });

                window.updateGraphData({ ...graphData });
                document.getElementById('stateCount').textContent = graphData.nodes.length;
                document.getElementById('edgeCount').textContent = graphData.links.length;

                const nextStates = generateNextStates(state);
                for (const next of nextStates) {
                    const nextStateKey = stateToString(next);
                    if (!visited.has(nextStateKey)) stack.push({ state: next, parent: nodeId });
                    else graphData.links.push({ source: nodeId, target: stateToNodeId.get(nextStateKey) });
                }
            }
        }

        function calculateCentrality(graphData, closenessHighlight) {
            const n = graphData.nodes.length;
            const adjacency = new Map();

            // inicializa mapa de adjacência
            for (const node of graphData.nodes) adjacency.set(node.id, new Set());
            for (const link of graphData.links) {
                adjacency.get(link.source).add(link.target);
                adjacency.get(link.target).add(link.source);
            }

            // centralidade de grau
            for (const node of graphData.nodes) {
                node.degree = adjacency.get(node.id).size;
            }

            // centralidade de proximidade e radialidade
            for (const node of graphData.nodes) {
                const distances = bfsDistances(node.id, adjacency);
                const sumDist = Object.values(distances).reduce((a,b)=>a+b,0);
                node.closeness = sumDist > 0 ? (n - 1) / sumDist : 0;
                node.radiality = sumDist > 0 ? ( (n-1) - sumDist/(n-1) ) : 0;
                node.eccentricity = Math.max(...Object.values(distances));
                node.label = `
                ID: ${node.id} </br>
                Grau: ${node.degree}</br>
                Centralidade: ${node.closeness.toFixed(2)}</br>
                Radialidade: ${node.radiality.toFixed(2)}</br>
                Excentricidade: ${node.eccentricity}
                `;
            }

            graphData.nodes.forEach(n => n.betweenness = 0);
            for (const s of graphData.nodes) {
                const stack = [], pred = new Map();
                const sigma = new Map(), dist = new Map();
                const delta = new Map();
                graphData.nodes.forEach(v => { pred.set(v.id, []); sigma.set(v.id, 0); dist.set(v.id, -1); delta.set(v.id, 0); });
                sigma.set(s.id, 1); dist.set(s.id, 0);
                const queue = [s.id];

                while (queue.length > 0) {
                    const v = queue.shift();
                    stack.push(v);
                    for (const w of adjacency.get(v)) {
                        if (dist.get(w) < 0) {
                            dist.set(w, dist.get(v) + 1);
                            queue.push(w);
                        }
                        if (dist.get(w) === dist.get(v) + 1) {
                            sigma.set(w, sigma.get(w) + sigma.get(v));
                            pred.get(w).push(v);
                        }
                    }
                }

                while (stack.length > 0) {
                    const w = stack.pop();
                    for (const v of pred.get(w)) {
                        delta.set(v, delta.get(v) + (sigma.get(v)/sigma.get(w))*(1 + delta.get(w)));
                    }
                    if (w !== s.id) graphData.nodes[w].betweenness += delta.get(w);
                }
            }

            if (closenessHighlight) {
                const maxCloseness = Math.max(...graphData.nodes.map(n => n.closeness), 0.00001);
                graphData.nodes.forEach(n => {
                    const t = n.closeness / maxCloseness; 

                    let r, g, b;

                    if (t < 0.5) {
                        const localT = t / 0.5;
                        r = 0;
                        g = Math.round(255 * localT);
                        b = Math.round(255 * (1 - localT));
                    } else {
                        const localT = (t - 0.5) / 0.5;
                        r = Math.round(255 * localT);
                        g = Math.round(255 * (1 - localT));
                        b = 0;
                    }

                    const toHex = (v) => v.toString(16).padStart(2, '0');
                    n.color = `#${toHex(r)}${toHex(g)}${toHex(b)}`;
                });

            } else {
                graphData.nodes.forEach(n => {
                    if (n.id === 0) {
                        n.color = '#ff5733';
                    } else {
                        n.color = n.isSolution ? '#3498db' : 'white';
                    }
                });
            }

            return graphData;
        }

        function bfsDistances(start, adjacency, removed = new Set()) {
            const dist = {};
            if (removed.has(start)) return dist;

            const queue = [start];
            dist[start] = 0;

            while (queue.length > 0) {
                const node = queue.shift();
                for (const neighbor of adjacency.get(node) || []) {
                    if (removed.has(neighbor)) continue;
                    if (dist[neighbor] === undefined) {
                        dist[neighbor] = dist[node] + 1;
                        queue.push(neighbor);
                    }
                }
            }
            return dist;
        }

        function measureRobustness(graphData, adj, bfsFunc) {
            const total = graphData.nodes.length;
            const fractionSteps = 10;
            let sumLargest = 0;

            const nodesArray = [...graphData.nodes];

            for (let step = 0; step <= fractionSteps; step++) {
                const removeCount = Math.floor((step / fractionSteps) * total);

                const shuffled = [...nodesArray].sort(() => Math.random() - 0.5);

                const removed = new Set(
                    shuffled
                        .slice(0, removeCount)
                        .map(n => n.id)
                );

                const remaining = nodesArray.filter(n => !removed.has(n.id));
                const visited = new Set();
                let largest = 0;

                for (const node of remaining) {
                    if (visited.has(node.id)) continue;
                    const dist = bfsFunc(node.id, adj, removed);
                    const compSize = Object.keys(dist).length;
                    largest = Math.max(largest, compSize);
                    Object.keys(dist).forEach(id => visited.add(id));
                }

                sumLargest += largest / total;
            }

            return (1 / (fractionSteps + 1)) * sumLargest;
        }

        function measureTargetedRobustness(graphData, adj, bfsFunc, steps = 10) {
            const total = graphData.nodes.length;
            const degrees = graphData.nodes.map(node => {
                const id = node.id;
                return {
                    id,
                    degree: graphData.links.filter(l =>
                        (l.source.id || l.source) === id || (l.target.id || l.target) === id
                    ).length
                };
            });

            const sorted = [...degrees].sort((a, b) => b.degree - a.degree);

            let sumLargest = 0;
            for (let step = 0; step <= steps; step++) {
                const removeCount = Math.floor((step / steps) * total);
                const removed = new Set(sorted.slice(0, removeCount).map(n => n.id));

                const remaining = graphData.nodes.filter(n => !removed.has(n.id));
                const visited = new Set();
                let largest = 0;

                for (const node of remaining) {
                    if (visited.has(node.id)) continue;
                    const dist = bfsFunc(node.id, adj, removed);
                    const compSize = Object.keys(dist).length;
                    largest = Math.max(largest, compSize);
                    Object.keys(dist).forEach(id => visited.add(id));
                }

                sumLargest += largest / total;
            }

            return (1 / (steps + 1)) * sumLargest;
        }

        function finishGeneration(graphData) {
            let nextNodeId = graphData.nodes.length;
            const adj = new Map();
            graphData.nodes.forEach(node => adj.set(node.id, new Set()));

            const degreesMap = new Map();
            graphData.nodes.forEach(node => degreesMap.set(node.id, 0));

            graphData.links.forEach(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;

                // Add to adjacency
                adj.get(s).add(t);
                adj.get(t).add(s);

                // Count degrees
                degreesMap.set(s, degreesMap.get(s) + 1);
                degreesMap.set(t, degreesMap.get(t) + 1);
            });

            // Eccentricities, radius, diameter, centers
            const eccentricities = {};
            for (const node of graphData.nodes) {
                const distances = bfsDistances(node.id, adj);
                const reachable = Object.values(distances);
                eccentricities[node.id] = reachable.length > 0 ? Math.max(...reachable) : Infinity;
            }
            const finiteEcc = Object.values(eccentricities).filter(v => v !== Infinity);
            const radius = Math.min(...finiteEcc);
            const diameter = Math.max(...finiteEcc);
            const centerNodes = Object.entries(eccentricities)
                .filter(([_, e]) => e === radius)
                .map(([id]) => id);

            // Degree distribution for gamma
            const degreeCount = {};
            Array.from(degreesMap.values()).forEach(d => {
                degreeCount[d] = (degreeCount[d] || 0) + 1;
            });
            const distribution = Object.entries(degreeCount)
                .map(([k,v]) => ({ k: parseInt(k), pk: v / graphData.nodes.length }))
                .filter(d => d.k > 0 && d.pk > 0);

            const logData = distribution.map(d => ({
                x: Math.log(d.k),
                y: Math.log(d.pk)
            }));

            let gamma = null;
            if (logData.length >= 2) {
                const n = logData.length;
                const sumX = logData.reduce((a,b) => a + b.x, 0);
                const sumY = logData.reduce((a,b) => a + b.y, 0);
                const sumXY = logData.reduce((a,b) => a + b.x * b.y, 0);
                const sumX2 = logData.reduce((a,b) => a + b.x*b.x, 0);
                const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);
                gamma = -slope;
                if (gamma < 0 || !isFinite(gamma)) gamma = null;
            }
            const isScaleFree = gamma && gamma >= 2 && gamma <= 3;

            // --- Centralities ---
            const nodeMap = new Map();
            graphData.nodes.forEach(n => {
                n.degree = degreesMap.get(n.id);
                nodeMap.set(n.id, n);
                n.betweenness = 0; // init
            });

            for (const node of graphData.nodes) {
                const distances = bfsDistances(node.id, adj);
                const sumDist = Object.values(distances).reduce((a,b)=>a+b,0);
                node.closeness = sumDist > 0 ? (graphData.nodes.length-1)/sumDist : 0;
                const diameterNode = Math.max(...Object.values(distances));
                node.radiality = sumDist > 0 ? ((graphData.nodes.length-1)*(diameterNode+1) - sumDist)/(graphData.nodes.length-2) : 0;
                node.eccentricity = diameterNode;
            }

            // Betweenness centrality (Brandes)
            for (const s of graphData.nodes) {
                const stack = [], pred = new Map();
                const sigma = new Map(), dist = new Map(), delta = new Map();
                graphData.nodes.forEach(v => { pred.set(v.id, []); sigma.set(v.id, 0); dist.set(v.id, -1); delta.set(v.id, 0); });
                sigma.set(s.id, 1);
                dist.set(s.id, 0);
                const queue = [s.id];

                while (queue.length > 0) {
                    const v = queue.shift();
                    stack.push(v);
                    for (const w of adj.get(v)) {
                        if (dist.get(w) < 0) {
                            dist.set(w, dist.get(v)+1);
                            queue.push(w);
                        }
                        if (dist.get(w) === dist.get(v)+1) {
                            sigma.set(w, sigma.get(w)+sigma.get(v));
                            pred.get(w).push(v);
                        }
                    }
                }

                while (stack.length > 0) {
                    const w = stack.pop();
                    for (const v of pred.get(w)) {
                        delta.set(v, delta.get(v) + (sigma.get(v)/sigma.get(w))*(1 + delta.get(w)));
                    }
                    if (w !== s.id) nodeMap.get(w).betweenness += delta.get(w);
                }
            }

            // --- Robustness ---
            const robustness = measureRobustness(graphData, adj, bfsDistances);
            const targetedRobustness = measureTargetedRobustness(graphData, adj, bfsDistances, 10);

            const nNodes = graphData.nodes.length;
            const mLinks = graphData.links.length;
            const L = averagePathLengthFast(adj); // função BFS otimizada abaixo
            const C = clusteringCoefficientFast(adj);
            const p = 2*mLinks/(nNodes*(nNodes-1));
            const L_random = Math.log(nNodes)/Math.log(nNodes*p);
            const C_random = p;
            const isSmallWorld = (C > 5*C_random) && (L/L_random < 2);

            updateStatus(`
                <div style="max-height: 180px; overflow-y: auto; padding-right: 6px; line-height: 1.5;">
                    Completo<br>
                    Vértices: ${graphData.nodes.length}.<br>
                    Arestas: ${graphData.links.length}.<br>
                    Raio: ${radius}.<br>
                    Diâmetro: ${diameter}.<br>
                    Centro(s): ${centerNodes.join(', ')}.<br>
                    Expoente γ ≈ ${gamma ? gamma.toFixed(2) : 'N/A'}<br>
                    Rede sem escala: ${isScaleFree ? 'Sim' : 'Não'}<br>
                    Robustez: ${(robustness*100).toFixed(1)}%<br>
                    Robustez direcionada: ${(targetedRobustness*100).toFixed(1)}%<br>
                    Caminho médio: ${L.toFixed(2)}<br>
                    Coef. de agrupamento: ${C.toFixed(3)}<br>
                    Rede pequeno mundo: ${isSmallWorld ? 'Sim' : 'Não'}
                </div>
            `);

            isGenerating = false;
            currentSearchNode = null;
        }

        function averagePathLengthFast(adj) {
            let totalDist = 0, pairCount = 0;
            const nodes = Array.from(adj.keys());
            for (const node of nodes) {
                const dist = bfsDistances(node, adj);
                const vals = Object.values(dist);
                totalDist += vals.reduce((a,b)=>a+b,0);
                pairCount += vals.length - 1;
            }
            return totalDist/pairCount;
        }

        function clusteringCoefficientFast(adj) {
            let sumC = 0;
            let nNodes = adj.size;

            for (const node of adj.keys()) {
                const neighbors = Array.from(adj.get(node));
                const k = neighbors.length;
                if (k < 2) {
                    // Clustering coefficient for nodes with <2 neighbors is 0
                    sumC += 0;
                    continue;
                }

                let linksBetween = 0;
                for (let i = 0; i < k; i++) {
                    const neighI = adj.get(neighbors[i]);
                    for (let j = i + 1; j < k; j++) {
                        if (neighI.has(neighbors[j])) linksBetween++;
                    }
                }

                sumC += (2 * linksBetween) / (k * (k - 1));
            }

            return sumC / nNodes;
        }



        function getCurrentPuzzleState() {
            const blocks = Array.from(document.querySelectorAll('.block')).map(b => {
                const rect = b.getBoundingClientRect();
                const gridRect = document.getElementById('puzzleContainer').getBoundingClientRect();
                return {
                    id: b.dataset.blockId,
                    type: b.dataset.type,
                    row: Math.round((rect.top - gridRect.top) / CELL_SIZE),
                    col: Math.round((rect.left - gridRect.left) / CELL_SIZE),
                    ...blockTypes[b.dataset.type]
                };
            });
            return blocks;
        }

        function stateToString(state) {
            const sortedState = [...state].sort((a, b) => {
                if (a.row !== b.row) return a.row - b.row;
                return a.col - b.col;
            });
            return sortedState.map(b => `${b.type}@${b.row},${b.col}`).join('|');
        }

        function isWinState(state) {
            const mainBlock = state.find(b => b.type === '2x2');
            return mainBlock && mainBlock.row === 3 && mainBlock.col === 1;
        }

        function generateNextStates(blocks) {
            const nextStates = new Map();
            function spacesUsed(b, row, col) {
               let a = [];
                for (let r = 0; r < b.height; r++) {
                    for (let c = 0; c < b.width; c++) {
                        a.push((row + r) * GRID_WIDTH + (col + c));
                    }
                }
                return a;
            }
            const emptyCells = new Set(Array.from({ length: 20 }, (_, i) => i));
            blocks.forEach(b => {
              spacesUsed(b, b.row, b.col).forEach(x => {
                  emptyCells.delete(x)
                  });
            });

            blocks.forEach((block, index) => {
              spacesUsed(block, block.row, block.col).forEach(x => {
              emptyCells.add(x)
              });

                const allMoves = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
                let allowedMoves = [];

                switch (block.type) {
                    case '1x2':
                        allowedMoves = allMoves.filter(move => move.dc === 0);
                        break;
                    case '2x1':
                        allowedMoves = allMoves.filter(move => move.dr === 0);
                        break;
                    default:
                        allowedMoves = allMoves;
                        break;
                }

                allowedMoves.forEach(move => {
                    const newRow = block.row + move.dr;
                    const newCol = block.col + move.dc;

                    if (newRow < 0 || newCol < 0 || newRow + block.height > GRID_HEIGHT || newCol + block.width > GRID_WIDTH) return;

                    let canMove = true;
                    spacesUsed(block, newRow, newCol).forEach(x => {
                      canMove = canMove && emptyCells.has(x);
                      });

                    if (canMove) {
                        const newState = JSON.parse(JSON.stringify(blocks));
                        newState[index].row = newRow;
                        newState[index].col = newCol;
                        const stateKey = stateToString(newState);
                        if (!nextStates.has(stateKey)) {
                           nextStates.set(stateKey, newState);
                        }
                    }
                });

                spacesUsed(block, block.row, block.col).forEach(x => {
                  emptyCells.delete(x)
                  });
            });
            return Array.from(nextStates.values());
        }

        function findSolution(graph) {
            const startNodeId = 0;
            const goalNode = graph.nodes.find(n => n.isSolution);
            if (goalNode === undefined) return null;

            const adj = new Map();
            graph.links.forEach(({ source, target }) => {
                const sourceId = source.id ?? source;
                const targetId = target.id ?? target;
                if (!adj.has(sourceId)) adj.set(sourceId, []);
                if (!adj.has(targetId)) adj.set(targetId, []);
                adj.get(sourceId).push(targetId);
                adj.get(targetId).push(sourceId);
            });

            const queue = [[startNodeId]];
            const visited = new Set([startNodeId]);

            while (queue.length > 0) {
                const path = queue.shift();
                const nodeId = path[path.length - 1];
                if (nodeId === goalNode.id) return path;

                (adj.get(nodeId) || []).forEach(neighbor => {
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push([...path, neighbor]);
                    }
                });
            }
            return null;
        }

        function showSolutionPathToggle() {
            window.showSolutionPath = !window.showSolutionPath;
            buildStateGraphAnimated();
        }

        function showClosenessHighlightToggle() {
            window.showClosenessHighlight = !window.showClosenessHighlight;
            buildStateGraphAnimated('bfs', window.showClosenessHighlight);
        }

        // Global functions
        window.generateRandomPuzzle = generateRandomPuzzle;
        window.showSolutionPath = false;
        window.showSolutionPathToggle = showSolutionPathToggle;
        window.showClosenessHighlight = false;
        window.showClosenessHighlightToggle = showClosenessHighlightToggle;
        window.clearPuzzle = clearPuzzle;
        window.THREE = THREE;
        window.nodeStates = nodeStates;
        window.displayPuzzleState = displayPuzzleState;
        window.init = init

        document.addEventListener('DOMContentLoaded', () => { setTimeout(() => {init()}, 100) });

  </script>

<script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function GraphVisualization() {
        const [graphData, setGraphData] = useState({ nodes: [], links: [] });
        const fgRef = useRef();

        useEffect(() => {
          // Expose a function to the global scope to be called from plain JS
          window.updateGraphData = (newData) => {
            setGraphData(newData);
          };

          // Enable camera damping for momentum
          const controls = fgRef.current.controls();
          controls.enableDamping = true;
          controls.dampingFactor = 1.6;

          // The ForceGraph component has its own animation loop,
          // so we don't need to manually call controls.update()
        }, []);

        useEffect(() => {
          // Zoom to fit whenever the graph data changes
          if (fgRef.current && graphData.nodes.length) {
             document.querySelector('#right-panel .loading').style.display = 'none';
            // Use a larger padding to ensure the graph is not clipped
             fgRef.current.zoomToFit(400, 150);
          }
          else {
            document.querySelector('#right-panel .loading').style.display = 'block';
          }
        }, [graphData]);


        const getNodeColor = (node) => {
            if (node.isSolution) return 'cyan';
            if (node.id === 0) return 'orangered';
            return 'white';
        };

        const getLinkColor = (link) => (link.color || 'white');
        const getLinkWidth = (link) => (link.isSolution ? 5 : 3);
        const getLinkDirectionalParticles = (link) => (link.isSolution ? 2 : 0);
        const getLinkOpacity = (link) => 1
        const getNodeOpacity = (node) => 1

        var getNodeThreeObject = function(node) {

            let color = node.color || 'white';


        // Glow sphere mesh.
            const glowSize = 3;
            const geometry = new THREE.SphereGeometry(glowSize, 11, 11);
            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3,
                depthTest: false
              });
            const glowEffect = new THREE.Mesh(geometry, material);
            glowEffect.name = "glow";

                // Smaller solid sphere mesh.
            const geometrySolid = new THREE.SphereGeometry(2, 9, 9);
            const materialSolid = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 1.0,
                depthTest: false
              });
            const mesh = new THREE.Mesh(geometrySolid, materialSolid);

                // Place the smaller solid sphere inside the large glow sphere.
            var group = new THREE.Group();
            group.add(mesh);
            group.add(glowEffect);

            return group;
        }

        const getLinkThreeMaterial = function(link) {

                    // Create edges - glowing lines
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 'white',
                transparent: false,
                opacity: 1
            });

            const solutionLineMaterial = new THREE.LineBasicMaterial({
                color: 'cyan',
                transparent: true,
                opacity: 1
            });


            if (link.isSolution && window.showSolutionPath) {
                return(solutionLineMaterial);
            }
            return lineMaterial;

            }



        return <ForceGraph3D
            ref={fgRef}
            graphData={graphData}
            nodeLabel="label"
            nodeColor={getNodeColor}
            nodeOpacity={1}
            linkColor={getLinkColor}
            linkWidth={getLinkWidth}
            linkOpacity={1}
            nodeThreeObject={getNodeThreeObject}
            linkMaterial={getLinkThreeMaterial}
            backgroundColor="#0a0a0a"
          />;
      }

      ReactDOM.render(
        <GraphVisualization />,
        document.getElementById('visualization')
      );



    </script>
